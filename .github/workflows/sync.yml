name: Sync from gtasix.how
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the published files
        run: |
          for f in gta6-facts.json prices.csv unlock-times.csv gta6-reviews.csv; do
            curl -sfL "https://gtasix.how/data/$f" -o "data/$f.new" && mv "data/$f.new" "data/$f"
          done
      - name: Commit if anything changed
        run: |
          git config user.name "gtasix-data sync"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Sync from https://gtasix.how/data/ ($(date -u +%F))"
          git push
